
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mini ChatGPT — AI Assistant</title>
  <link rel="stylesheet" href="/style.css?v=10">
</head>

<body>
<div class="app-shell" id="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-logo">✦</span>
        <span>Mini ChatGPT</span>
      </div>
      <button class="icon-button" id="close-sidebar"
              title="Close sidebar">☰</button>
    </div>

    <button id="new-chat" class="new-chat">
      <span>✎</span> New chat
    </button>

    <div class="history-heading">Your chats</div>
    <div class="history-list" id="chat-history"></div>

    <div class="sidebar-footer">
      <div class="status-line">
        <span class="status-dot"></span>
        <span id="connection-label">Checking connection…</span>
      </div>
      <small>Powered by Gemini AI</small>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- MAIN AREA -->
  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button id="toggle-sidebar" class="icon-button"
                title="Toggle sidebar">☰</button>

        <span class="app-title">Mini ChatGPT</span>
        <span class="mode-pill" id="mode-pill">
          Connecting…
        </span>
      </div>

      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-button"
                title="Toggle dark mode">☾</button>
        <button id="top-new-chat" class="icon-button"
                title="New chat">✎</button>
      </div>
    </header>

    <!-- CHAT MESSAGES -->
    <section class="chat" id="chat"
             aria-live="polite"></section>

    <!-- MESSAGE COMPOSER -->
    <div class="composer-area">
      <form id="chat-form" class="composer">
        <textarea
          id="message"
          rows="1"
          maxlength="8000"
          placeholder="Ask anything..."
          aria-label="Message Mini ChatGPT"
        ></textarea>

        <div class="composer-bottom">
          <label class="search-toggle">
            <input type="checkbox"
                   id="web-search" checked>
            <span>◎ Search</span>
          </label>

          <span class="keyboard-hint">
            Enter to send · Shift+Enter for new line
          </span>

          <button id="send" type="submit"
                  title="Send message">↑</button>

          <button id="stop" type="button"
                  title="Stop response" hidden>■</button>
        </div>
      </form>

      <p class="disclaimer">
        Mini ChatGPT can make mistakes.
        Verify important information.
      </p>
    </div>

  </main>
</div>

<script src="/script.js?v=10" defer></script>
</body>
</html>
